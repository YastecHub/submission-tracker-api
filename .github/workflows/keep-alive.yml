name: Keep API Awake

# Heroku Eco dynos sleep after 30 minutes without traffic. Pinging every
# 20 minutes keeps the API warm. Remove this workflow on a Basic or larger dyno.
on:
  schedule:
    # Avoid the busiest top-of-hour boundary. GitHub schedules are best-effort.
    - cron: '7,27,47 * * * *'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: api-keep-alive
  cancel-in-progress: true

jobs:
  ping:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Ping warmup endpoint
        env:
          BASE_URL: ${{ secrets.API_URL }}
          WARMUP_TOKEN: ${{ secrets.WARMUP_TOKEN }}
        run: |
          BASE_URL="${BASE_URL%/}"

          if [ -z "$BASE_URL" ]; then
            echo "API_URL secret is not configured (e.g. https://your-app.herokuapp.com)"
            exit 1
          fi

          STATUS=$(curl --silent --show-error --location \
            --connect-timeout 20 --max-time 120 --retry 2 --retry-all-errors \
            -o /tmp/warmup-response.txt -w "%{http_code}" \
            -H "x-warmup-token: ${WARMUP_TOKEN}" \
            "$BASE_URL/api/warmup")

          echo "Warmup response status: $STATUS"

          if [ "$STATUS" = "200" ]; then
            exit 0
          fi

          echo "Warmup endpoint did not return 200. Response preview:"
          head -c 500 /tmp/warmup-response.txt || true
          echo ""
          echo "Checking basic health endpoint as fallback..."

          HEALTH_STATUS=$(curl --silent --show-error --location \
            --connect-timeout 20 --max-time 120 --retry 2 --retry-all-errors \
            -o /dev/null -w "%{http_code}" "$BASE_URL/api/health")
          echo "Health response status: $HEALTH_STATUS"

          if [ "$HEALTH_STATUS" != "200" ]; then
            echo "Warning: both warmup and health checks failed"
            exit 1
          fi

          echo "Health endpoint is up, but /api/warmup failed. Ensure WARMUP_TOKEN matches in GitHub and the Heroku config vars."
          exit 1
