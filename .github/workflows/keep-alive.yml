name: Keep Render Awake

on:
  schedule:
    - cron: '*/10 * * * *'
  workflow_dispatch:

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Ping health endpoint
        run: |
          STATUS=$(curl -s -o /dev/null -w "%{http_code}" \
            -H "x-warmup-token: ${{ secrets.WARMUP_TOKEN }}" \
            ${{ secrets.RENDER_API_URL }}/api/warmup)
          echo "Response status: $STATUS"
          if [ "$STATUS" != "200" ]; then
            echo "Warning: warmup check returned $STATUS"
            exit 1
          fi
